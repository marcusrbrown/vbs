---
name: Fro Bot

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  discussion_comment:
    types: [created]
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, review_requested]
  schedule:
    # Daily oversight + autohealing pass at 03:30 UTC — staggered off other
    # repos in the portfolio (marcusrbrown: 04:30, tokentoilet: 03:30,
    # update-repo-settings: 02:55).
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Operation mode
        type: choice
        options:
          - review
          - autoheal
        default: autoheal
      prompt:
        description: Custom prompt for review mode
        required: false
        default: ''

permissions:
  contents: read

# Scheduled and dispatched daily passes share one slot so they never
# overlap on the daily report or autoheal branches.
concurrency:
  group: >-
    fro-bot-${{
      github.event.issue.number ||
      github.event.pull_request.number ||
      github.event.discussion.number ||
      ((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'autoheal')) && 'daily') ||
      github.run_id
    }}
  cancel-in-progress: false

env:
  PR_REVIEW_PROMPT: |
    Review this PR for the VBS (View By Stardate) project — a TypeScript +
    Vite + D3.js Star Trek viewing guide using functional factory architecture.
    Read AGENTS.md for full project conventions before reviewing.

    Focus your review on:

    1. CORRECTNESS & EDGE CASES
       - Logic errors, off-by-one, null/undefined paths
       - Async race conditions in event handling and storage operations
       - Closure captures in factory functions (stale state risks)
       - Workflow gating (if: conditions, needs: chains, the skipped-needs
         trap — finalize jobs that depend on conditional prepare jobs MUST
         use !cancelled() to bypass the implicit success() guard)
       - Silent failure paths: continue-on-error: true on local deterministic
         steps is a red flag (use it only for external-API fetches with
         clear fallback behavior)

    2. SECURITY
       - Credentials, localStorage access, API keys — never hardcoded
       - No `eval()` or `Function()` constructors near user-supplied data
       - Token scopes minimum-necessary in any workflow changes

    3. BREAKING CHANGES
       - Public factory API signatures (arguments, return shape)
       - Event map types in `src/modules/types.ts`
       - Storage schema changes without version migration

    4. TEST COVERAGE
       - New/changed behavior must have test coverage
       - Factory instantiation patterns in `beforeEach`
       - Type-level tests in `.test-d.ts` for generic API changes

    5. VBS-SPECIFIC VIOLATIONS
       - Missing `.js` extensions in imports (runtime breakage in ESM)
       - Use of `any` instead of `unknown` + type guards
       - Class-based patterns instead of functional factories
       - `this` binding instead of closure-based state
       - Missing `destroy()` on components/factories with listeners
       - Inline styles instead of CSS custom properties (`--vbs-` prefix)
       - Missing event map types in `src/modules/types.ts`
       - No `withErrorHandling()` / `withSyncErrorHandling()` on public methods

    Skip style nits — the linter handles those.

    Do NOT push commits, modify code, or create branches. Review only.
    Use inline comments for file-specific issues. Reserve the review body
    for the structured summary below.

    You MUST structure your review using exactly these headings:
    ## Verdict: [PASS | CONDITIONAL | REJECT]
    CONDITIONAL = can merge after addressing the listed blocking issues.
    ### Blocking issues
    ### Non-blocking concerns
    ### Missing tests
    ### Risk assessment (LOW/MED/HIGH) + rationale
    Evaluate likelihood of regression, security exposure, or blast radius.
    If a section has no items, write "None" under the heading.
    Do not omit any heading.

  SCHEDULE_PROMPT: |
    Run the daily Fro Bot pass for marcusrbrown/vbs — VBS (View By Stardate),
    a local-first Star Trek chronological viewing guide built with TypeScript
    + Vite + D3.js, using functional factory architecture with closure-based
    state and generic EventEmitters. Deployed to GitHub Pages at /vbs/.
    Read AGENTS.md (and src/modules/AGENTS.md and src/components/AGENTS.md
    when touching those directories) before making changes.

    This single run does BOTH proactive oversight (detect and report) AND
    reactive autohealing (fix what is safe). Prioritize minimal, reversible
    changes. Every run must leave the project measurably better or report
    precisely why it could not.

    EXECUTION MODEL
    Analyze every category, but perform write actions serially. Never keep
    more than one branch checked out at a time — complete one mutation,
    return to a clean working tree, then continue.
    Create every new fix branch from the latest default branch
    (`git fetch origin main` then `git switch -c <branch> origin/main`),
    never from whatever ref the run checked out.

    CONTINUITY (read before acting)
    1. Read the previous daily report: the most recent issue whose title
       starts with "Daily Fro Bot Report —" (open or closed). If none
       exists, read the newest "Daily Autohealing Report" and "Daily
       Maintenance Report" issues instead.
    2. Carry forward every unresolved item from its "Tasks for Agents"
       and "Needs Human Attention" sections. Mark items new since the
       previous report with ★ and items resolved since then with ✅.
    3. If the same finding appears unresolved in 3 or more consecutive
       reports, escalate it under "Needs Human Attention" with the count
       of consecutive runs and a single recommended decision.

    DEDUPLICATION (applies to ALL categories)
    Before creating any PR or issue, list every open fro-bot PR and issue
    (`gh pr list --author fro-bot --state open`, `gh issue list --author
    fro-bot --state open`). Match on root cause AND on touched files. If an
    open fro-bot PR already addresses the same root cause or edits the same
    files for the same purpose, update that PR (push to its branch; merge
    or rebase the default branch into it if it conflicts) instead of
    opening a new one.
    Name new fix branches `autoheal/<root-cause-slug>` with no date or run
    suffix, so the same root cause always maps to the same branch. If that
    branch already exists, reuse it.

    REVIEW BACKLOG CAP
    Marcus reviews every PR by hand. If 3 or more fro-bot PRs are open and
    awaiting review after SELF-CLEANUP, do not open new non-security PRs.
    Record each would-be fix under "Tasks for Agents" instead. Exempt:
    repairs to existing fro-bot PRs, critical/high security remediation,
    and fixes for a quality gate that fails on the default branch.

    SELF-CLEANUP (own PRs only)
    You may close a fro-bot-authored PR only when ALL of these hold:
    every commit on it is authored by fro-bot, marcusrbrown has not
    commented on or reviewed it, and one of the following is true:
    a. Another open fro-bot PR addresses the same root cause (keep the
       most complete mergeable one; close the rest).
    b. The fix is already on the default branch, or the failure it
       targets no longer reproduces on the default branch.
    Leave a one-line closing comment linking the surviving PR or the
    commit on main. Never close any other PR. Never delete branches.

    DECLINED FIXES (learn from rejection)
    Before proposing any fix, list fro-bot PRs closed without merge in the
    last 90 days (`gh pr list --author fro-bot --state closed`) and read the
    closing comment from marcusrbrown. Never re-propose a declined fix in
    the same form. If the closing comment prescribes a different approach,
    apply that approach instead. If a declined fix was redundant, verify
    the problem still exists on main before acting on the same finding
    again.

    SCOPE CAP
    Only auto-heal a fix that is clearly minimal and reversible. If the
    smallest safe fix is a broad refactor, an architecture change, or a
    many-file edit, do NOT auto-heal it — record it under "Tasks for
    Agents" (see AGENT NOTES).

    DEPENDENCY OWNERSHIP
    Renovate owns routine dependency/version bumps (configured via
    marcusrbrown/renovate-config preset). You may change dependency versions
    only when remediating a confirmed security advisory (critical/high) or
    repairing an existing security-update PR. Do not create non-security
    version-bump PRs, and do not batch unrelated dependency changes into a
    security fix. Do NOT modify package.json versions outside category 2
    security remediation.

    TRUSTED AUTHORS
    Trusted PR authors for branch repair are Marcus and these automation bots:
    - renovate[bot]
    - dependabot[bot]
    - fro-bot

    CATEGORIES (work in order)

    1. ERRORED PRs
       Find open PRs with failing CI checks. Skip dependency/security update
       PRs here; handle them only in category 2.
       Only fix PRs whose head branch is in this repository, writable by
       this token, and authored by a trusted source (repository
       owner/collaborator with write access, or an approved automation bot
       such as Renovate/Dependabot). If author trust cannot be established,
       skip the PR and log it under "Needs Human Attention".
       If the PR touches workflows, automation prompts, package-manager
       config, lockfiles, or execution scripts, do not run project commands
       from that branch. Skip it and log why.
       Respect SCOPE CAP: a large in-flight migration PR is report-only.
       For each fixable PR:
       a. Check out the PR branch.
       b. Read the failing check logs to diagnose the root cause.
       c. Fix the issue (type errors, lint failures, test regressions,
          build breaks).
       d. Commit with a clear conventional-commit message and push to the
          PR branch.
       e. Comment on the PR: root cause, fix applied, remaining risk.
       f. Never modify .github/workflows/ or this prompt while repairing
          an errored PR. If the failing run appears caused by the Fro Bot
          workflow, skip the PR and log it under "Needs Human Attention".

    2. SECURITY
       Review Dependabot/Renovate alerts and open PRs for vulnerable deps.
       - Before acting on any advisory, confirm the vulnerable version is
         still resolved on main (`pnpm why <pkg>` or the lockfile). Skip
         advisories main already resolves.
       - If a security update PR exists but has conflicts or failures,
         fix and push to that PR branch.
       - For unaddressed critical/high advisories with no existing PR,
         create one dedicated remediation PR.
       - Do NOT bulk-update unrelated deps in a security PR.
       If security advisory/alert data is unavailable to the token or CLI,
       skip this category and note "security alerts unavailable" under
       "Needs Human Attention". Do not guess.

    3. CODE QUALITY & REPO HYGIENE
       This category is primarily report-only. Focus on things only a
       code-aware agent can catch:
       - Run `pnpm build` (tsc && vite build). Report any type errors or
         build failures.
       - Run `pnpm test:coverage` and review coverage output. If coverage
         regresses or has gaps in critical modules (progress, storage,
         events, episode-tracker), open or update a single issue with
         failing metrics and top contributing files.
       - Scan for stale TODO/FIXME/HACK annotations older than 90 days
         (use git blame). Update the existing "Stale TODOs" issue rather
         than creating another.
       - Verify VBS convention compliance:
         * No `any`, `@ts-ignore`, or `@ts-expect-error` in src/
         * No class-based patterns (functional factories with closures only)
         * No `this` binding (closures eliminate context issues)
         * All imports use `.js` extensions for ESM resolution
         * No inline styles in .ts files (CSS custom properties only,
           `--vbs-` prefix)
         * All components in src/components/ have `destroy()` method
         * All factory modules have event map types in src/modules/types.ts
         * Error boundaries: public methods wrapped with
           `withErrorHandling()` or `withSyncErrorHandling()`
         Report findings but put actual code fixes into category 4.
       - Check that AGENTS.md files (root, src/modules/, src/components/)
         accurately reflect the current directory structure. If drift is
         found, open a PR with corrections; never delete a row for a
         directory that exists.

    4. DEVELOPER EXPERIENCE
       Ensure consistent linting, formatting, and static analysis.
       Run `pnpm lint`; fix any failures, including convention violations
       found in category 3.
       Open a PR for all fixes — never commit directly to the default
       branch. Group related lint/format/convention fixes into a single PR.
       Use a clear conventional-commit title like
       `chore(lint): apply auto-fixes from autohealing run`.

    5. QUALITY GATES VERIFICATION
       Verify the project's quality gates pass on the default branch:
       a. `pnpm lint` — 0 errors
       b. `pnpm exec tsc --noEmit` — type check passes
       c. `pnpm test` — all unit tests passing
       d. `pnpm build` — successful tsc + vite build
       e. `pnpm exec jiti scripts/validate-episode-data.ts` — data validation
          passes

       For each failing gate:
       - Identify the root cause from command output.
       - If the fix is minimal and safe, include it in a category 4 PR.
       - If the fix is complex, open or update one issue with diagnosis and
         recommended approach.

    6. DATA QUALITY
       Validate Star Trek dataset integrity:
       - Run `pnpm exec jiti scripts/validate-episode-data.ts --verbose`
         and report any validation failures.
       - Check for duplicate item IDs across all eras in
         src/data/star-trek-data.ts.
       - Verify ID patterns match conventions:
         Episode: /^[a-z]+_s\d+_e\d+$/
         Season: /^[a-z]+_s\d+$/
         Series: /^[a-z]+(?:_s\d+)?$/
       - Verify chronological ordering within each era.
       Report findings as issues. Do not modify star-trek-data.ts directly
       unless the fix is a clear typo (duplicate ID, malformed pattern).
       For content corrections, open an issue referencing the data-curator
       agent (.github/agents/data-curator.agent.md).

    7. REPOSITORY OVERSIGHT (report-only)
       Never comment on or modify individual issues/PRs in this category,
       and never apply labels. Report:
       - Summary metrics: issues opened since the last run, open PRs,
         stale issue/PR counts, main branch check status.
       - Stale issues: no activity >30 days; recommend one next step each.
       - Stale PRs: no activity >7 days; mark stale >14 days.
       - Duplicate open issues (same or near-identical titles or scope).
       - Unassigned bugs: open issues labelled `bug` with no assignee.
       - Workflow health: last 7 days of runs per workflow (success/
         failure/skipped). Flag any workflow with >50% failures and any
         workflow whose scheduled runs produced zero successes when they
         should have. (A silent 1.5-year outage went unnoticed in
         marcusrbrown/marcusrbrown; catch it fast here.)

    8. WORKFLOW INTEGRITY (report-only)
       Audit .github/workflows/*.yaml and .github/actions/**:
       - SHA pinning: every third-party action is pinned to a full commit
         SHA with a version comment (@<sha> # vX.Y.Z).
       - Least privilege: workflows and jobs declare minimal permissions.
       - Fork safety: flag any path that runs fork-controlled code with
         secrets present.
       - Gating traps: finalize jobs that depend on conditional jobs use
         !cancelled(); no continue-on-error on local deterministic steps.
       - `fro-bot/agent` pin vs latest release (Renovate owns the bump).
       Open or update one issue for anything actionable. Never edit
       workflows in a scheduled run.

    9. PROGRESSIVE IMPROVEMENT (report-only)
       Track the project's forward trajectory:
       - Open tracking work: test coverage gaps, convention-drift issues,
         data-quality issues, and `techdebt:` / `todo:` issues. Report what
         moved since the previous report and name the single next
         unblocked step for each.
       - Recurring findings escalated per CONTINUITY.
       - Declined fixes honored per DECLINED FIXES.
       - Patterns from category 10 worth adopting, ranked by payoff.

    10. CROSS-PROJECT INTELLIGENCE (INBOUND ONLY)
        Survey Marcus's other repos for patterns, tooling, and conventions
        that could improve THIS repo. Use `gh` CLI for all queries.
        Observation only — never modify other repos.

        Focus repos (the list should evolve — drop repos that consistently
        have nothing actionable, add repos that become relevant, and say so
        in the report):
        - `marcusrbrown/gpt` — React/Vite/TypeScript patterns, Fro Bot
          daily-pass prompt, CI safety practices
        - `marcusrbrown/marcusrbrown.github.io` — Vite/TypeScript patterns,
          workflow integrity, Fro Bot prompt evolution
        - `marcusrbrown/panthea` — Fro Bot daily-pass prompt, agent notes,
          docs/solutions learnings structure
        - `marcusrbrown/mothership` — CI safety practices, rulesets,
          progressive-improvement categories
        - `marcusrbrown/tokentoilet` — CI safety practices, single-issue
          reporting
        - `marcusrbrown/renovate-config` — dependency governance preset
          evolution (VBS extends it)
        - `fro-bot/agent` — runtime capabilities, example workflows, and
          release notes

        For each focus repo, check:
        a. Its `.github/workflows/fro-bot.yaml`: compare the `fro-bot/agent`
           pin and the daily prompt strategy with ours; report any strategy
           this repo lacks.
        b. CI and tooling patterns we could adopt.
        c. Renovate preset evolution.
        d. New conventions worth evaluating.
        Keep findings specific to this repo. Skip repos with nothing notable.

    11. UPSTREAM MODERNIZATION WATCH (SUNDAYS UTC ONLY)
        Runs only on Sundays UTC: run `date -u +%u` first and continue only
        if it prints 7. On other days skip this category and omit its
        section and Run Summary row.
        Review release notes for pinned upstreams:
        - `fro-bot/agent`, `actions/checkout`, `pnpm/action-setup`, and
          other actions pinned across .github/workflows/
        - Vite, TypeScript, D3.js, Vitest — majors and breaking changes
        - Renovate config preset updates from `marcusrbrown/renovate-config`
        - OpenCode/Fro Bot runtime docs relevant to configured tools,
          skills, agents, hooks, and durable session state
        Identify hardening or observability features worth adopting. Do not
        bump versions or modify workflows in this category.

    AGENT NOTES (instead of per-agent follow-up tasks)
    Do NOT create follow-up tasks addressed to a specific agent (no "for
    Fro Bot", "for Copilot", or similar). Write every deferred item so any
    LLM agent can pick it up cold:
    - Context: issue/PR links and exact file paths (with line numbers when
      known)
    - Root cause, stated as a verified fact or labelled as a hypothesis
    - Smallest safe fix
    - Constraints and "do not retry" warnings (including declined
      approaches)
    - Verification: the exact commands and expected results
    Collect all deferred, actionable work in one "Tasks for Agents"
    section. Reserve "Needs Human Attention" for decisions only Marcus can
    make.

    HARD BOUNDARIES
    - Never force-push, rewrite history, or delete branches.
    - Never push directly to the default branch. Pushes are allowed only to
      a new `autoheal/*` branch you create for a PR, or to an existing
      non-default PR branch you are repairing under category 1 or
      category 2.
    - Never merge PRs, submit reviews/approvals, enable automerge, reopen
      PRs, or modify branch protection. The only closures allowed are
      older daily report issues (see OUTPUT) and fro-bot PRs that meet
      SELF-CLEANUP.
    - Never modify secrets, org settings, environments, or branch
      protection.
    - Never make checks pass by disabling tests, deleting failing
      assertions, lowering coverage budgets, weakening lint/type rules, or
      editing configuration only to suppress failures. If the smallest safe
      fix would weaken a guardrail, skip it and log it under "Tasks for
      Agents".
    - Never modify .github/workflows/ or automation prompt files in a
      scheduled run. Report workflow findings under category 8.
    - Categories 10 and 11 MUST NOT modify other repos or bump pinned
      versions.

    Project conventions (MUST follow for code changes):
    - TypeScript strict mode: no `any`, no `@ts-ignore`, no `@ts-expect-error`
    - Functional factories only: no classes, no `this` binding
    - Closure-based state: private state in factory closures, public API returned
    - Generic EventEmitters: `createEventEmitter<TEventMap>()` for type-safe events
    - ESM imports: `.js` extensions required in all imports
    - Single quotes for string literals
    - Error handling: `withErrorHandling()` (async) / `withSyncErrorHandling()`
    - Components: provide `destroy()` for cleanup, co-locate .ts + .css
    - CSS: custom properties with `--vbs-` prefix, no inline styles
    - Package manager: pnpm (not npm/yarn)
    - YAML extension: .yaml, not .yml

    OUTPUT — ONE DATED DAILY REPORT ISSUE
    Creating, updating, and closing the daily report issue is authorized in
    this run. The branch-pr delivery mode covers only code fixes; never
    commit the report to the repository or open a PR for it.
    Maintain exactly one open daily report. Follow this order so the run
    is idempotent even if it overlaps another run:
    1. Search open issues whose exact title is
       "Daily Fro Bot Report — YYYY-MM-DD (UTC)" for today's UTC date.
    2. If one or more exist, pick the LOWEST issue number as canonical and
       edit its body in place. If none exist, create it.
    3. Close every OTHER open issue whose title starts with "Daily Fro Bot
       Report —" (older dates and same-day duplicates), plus any open
       legacy report issue — the perpetual "Daily Autohealing Report"
       (#563), the perpetual "Daily Maintenance Report" (#429), and any
       dated "Daily Autohealing Report — YYYY-MM-DD (UTC)" or "Daily
       Maintenance Report — YYYY-MM-DD" issue — each with a one-line
       closing comment linking the canonical report.
    There must be exactly one open daily report when the run finishes.
    Never close the canonical issue you just selected.

    The issue body MUST use this structure. Write "None" for empty
    sections, use links only (no full content duplication), and write
    "data unavailable" for inaccessible sources. Never emit an empty table.
    Omit the Upstream Modernization Watch row and section on non-Sundays.
    ## Daily Fro Bot Report — YYYY-MM-DD (UTC)
    Previous report: #N
    ### Run Summary
    | Category | Status | Notes |
    | --- | --- | --- |
    | Errored PRs | ✅/⚠️/❌ | ... |
    | Security | ✅/⚠️/❌ | ... |
    | Code Quality & Repo Hygiene | ✅/⚠️/❌ | ... |
    | Developer Experience | ✅/⚠️/❌ | ... |
    | Quality Gates | ✅/⚠️/❌ | ... |
    | Data Quality | ✅/⚠️/❌ | ... |
    | Repository Oversight | ✅/⚠️/❌ | ... |
    | Workflow Integrity | ✅/⚠️/❌ | ... |
    | Progressive Improvement | ✅/⚠️/❌ | ... |
    | Cross-Project Intelligence | ✅/⚠️/❌ | ... |
    | Upstream Modernization Watch | ✅/⚠️/❌ | ... |
    ### Since Last Report
    New (★), resolved (✅), and escalated items, plus PRs opened, updated,
    or closed by this run.
    ### Errored PRs
    ### Security
    ### Code Quality & Repo Hygiene
    ### Developer Experience
    ### Quality Gates
    ### Data Quality
    ### Repository Oversight
    ### Workflow Integrity
    ### Progressive Improvement
    ### Cross-Project Intelligence
    ### Upstream Modernization Watch
    ### Tasks for Agents
    ### Needs Human Attention

jobs:
  fro-bot:
    name: Fro Bot
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      discussions: write
    if: >-
      (
        github.event.pull_request == null ||
        (
          !github.event.pull_request.head.repo.fork &&
          !endsWith(github.event.pull_request.user.login || '', '[bot]')
        )
      ) && (
        (
          github.event_name == 'issues' &&
          !endsWith(github.event.issue.user.login || '', '[bot]') &&
          (github.event.issue.user.login || '') != 'fro-bot' &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association || '')
        ) ||
        (
          github.event_name == 'pull_request' &&
          !endsWith(github.event.pull_request.user.login || '', '[bot]') &&
          (github.event.pull_request.user.login || '') != 'fro-bot'
        ) ||
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (
          (github.event_name == 'issue_comment' ||
           github.event_name == 'pull_request_review_comment' ||
           github.event_name == 'discussion_comment') &&
          contains(github.event.comment.body || '', '@fro-bot') &&
          (github.event.comment.user.login || '') != 'fro-bot' &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || '')
        )
      )
    steps:
      - name: Refuse fork PR heads from comment triggers
        # issue_comment events carry no pull_request payload, so the
        # job-level fork guard does not see comment-triggered checkouts
        # of PR heads. Resolve the PR via the API and refuse fork heads
        # before any code from that ref runs.
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ secrets.FRO_BOT_PAT }}
        run: |
          pr_number="${{ github.event.issue.number }}"
          is_fork=$(gh api "repos/${{ github.repository }}/pulls/${pr_number}" --jq '.head.repo.fork // "unknown"')
          if [ "$is_fork" != "false" ]; then
            echo "::error::Refusing to check out fork PR head from comment trigger (PR #${pr_number}, fork=${is_fork})."
            exit 1
          fi

      - name: Validate review mode inputs
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'review'
        env:
          PROMPT: ${{ inputs.prompt }}
        run: |
          if [ -z "$PROMPT" ]; then
            echo "::error::Review mode requires a custom prompt. Provide one via the 'prompt' input, or choose a different mode."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: >-
            ${{
              (github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number))
              || github.event.pull_request.head.sha
              || ''
            }}
          token: ${{ secrets.FRO_BOT_PAT }}
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Build project
        run: pnpm build

      - name: Run Fro Bot
        uses: fro-bot/agent@5ce2291b002a0b308e4e8e5c13f1b397d1dbd330 # v0.131.0
        env:
          OPENCODE_PROMPT_ARTIFACT: 'true'
          PROMPT: >-
            ${{
              (github.event_name == 'workflow_dispatch' && inputs.prompt)
              || (github.event_name == 'workflow_dispatch' && inputs.mode == 'autoheal' && env.SCHEDULE_PROMPT)
              || (github.event_name == 'schedule' && env.SCHEDULE_PROMPT)
              || (github.event_name == 'pull_request' && env.PR_REVIEW_PROMPT)
              || ''
            }}
        with:
          auth-json: ${{ secrets.OPENCODE_AUTH_JSON }}
          github-token: ${{ secrets.FRO_BOT_PAT }}
          model: ${{ vars.FRO_BOT_MODEL }}
          # The daily pass must deliver fixes as PRs; under `working-dir` the
          # agent cannot push or open PRs, so its edits would be discarded.
          output-mode: >-
            ${{
              (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'autoheal'))
              && 'branch-pr'
              || 'working-dir'
            }}
          opencode-config: ${{ secrets.OPENCODE_CONFIG }}
          prompt: ${{ env.PROMPT }}
          timeout: 0
