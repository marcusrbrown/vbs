autoInstallPeers: true

dedupePeerDependents: true

allowBuilds:
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true

shamefullyHoist: true

shellEmulator: true

strictPeerDependencies: false

overrides:
  fast-uri: ^3.1.3
  # GHSA-5p4m-2wfm-xmqj (high): quadratic CPU consumption in !!omap
  # resolution. Transitive dev-only dependency (eslint config parsing,
  # jsdom, katex, toml-eslint-parser, confbox). Fixed upstream in the 5.x
  # line (5.2.1+); no 4.x backport exists. Remove once all transitive
  # consumers bump their own js-yaml requirement past 5.2.1.
  js-yaml: ^5.2.1
